# Builds GraphMTG.exe (Windows) and GraphMTG.app (macOS, Apple Silicon).
#  * Push a tag vX.Y.Z (matching __version__ in src/mtgcv/__init__.py) -> test, build and smoke-test
#    on both platforms, then publish a GitHub Release with GraphMTG.exe and GraphMTG-mac.zip attached.
#  * "Run workflow" (manual) -> same builds; kept as downloadable workflow artifacts only.
name: Build GraphMTG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path src/mtgcv/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match __version__ v$v" }

      - name: Run tests
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build GraphMTG.exe
        shell: pwsh
        run: ./packaging/build_exe.ps1

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $env:MTGCV_DATA_DIR = "$env:RUNNER_TEMP\gm-data"
          $env:MTGCV_CACHE_DIR = "$env:RUNNER_TEMP\gm-cache"
          $env:GRAPHMTG_NO_BROWSER = "1"
          $p = Start-Process -FilePath dist/GraphMTG.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            if (Test-Path "$env:MTGCV_DATA_DIR/server.json") {
              $port = (Get-Content "$env:MTGCV_DATA_DIR/server.json" -Raw | ConvertFrom-Json).port
              try {
                $h = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                $html = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/").Content
                if ($h.app -eq "graphmtg" -and $html -match "<title>GraphMTG</title>") { $ok = $true; break }
              } catch {}
            }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "GraphMTG.exe did not start and serve the UI" }
          "GraphMTG.exe started and served v$($h.version)"

      - name: Upload exe (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GraphMTG-windows
          path: dist/GraphMTG.exe

  mac:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build GraphMTG.app
        run: bash packaging/build_mac.sh

      - name: Smoke-test the app
        run: |
          export MTGCV_DATA_DIR="$RUNNER_TEMP/gm-data" MTGCV_CACHE_DIR="$RUNNER_TEMP/gm-cache" GRAPHMTG_NO_BROWSER=1
          # Runs the real menu-bar front end (the bundle is frozen), so this also checks rumps starts.
          dist/GraphMTG.app/Contents/MacOS/GraphMTG &
          pid=$!
          ok=0
          for i in $(seq 1 120); do
            if [ -f "$MTGCV_DATA_DIR/server.json" ]; then
              port=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['port'])" "$MTGCV_DATA_DIR/server.json")
              if curl -fs "http://127.0.0.1:$port/api/health" | grep -q '"graphmtg"' \
                && curl -fs "http://127.0.0.1:$port/" | grep -q "<title>GraphMTG</title>"; then
                ok=1; break
              fi
            fi
            sleep 0.5
          done
          sleep 2
          alive=0; kill -0 "$pid" 2>/dev/null && alive=1
          kill "$pid" 2>/dev/null || true
          echo "--- graphmtg.log"; cat "$MTGCV_DATA_DIR/graphmtg.log" || true
          [ "$ok" = 1 ] || { echo "GraphMTG.app did not start and serve the UI"; exit 1; }
          [ "$alive" = 1 ] || { echo "GraphMTG.app served the UI but then exited (menu bar failed?)"; exit 1; }
          echo "GraphMTG.app started and served the UI"

      - name: Upload app (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GraphMTG-mac
          path: dist/GraphMTG-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts # one folder per artifact: artifacts/GraphMTG-windows, artifacts/GraphMTG-mac

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/GraphMTG-windows/GraphMTG.exe \
            artifacts/GraphMTG-mac/GraphMTG-mac.zip \
            --title "GraphMTG ${{ github.ref_name }}" \
            --notes-file packaging/RELEASE_NOTES.md
