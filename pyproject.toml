[project]
name = "mtg-card-view"
version = "0.1.0"
description = "Analyze Magic: The Gathering card lists using Scryfall data (tags, EDHREC rank, card details)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mtgcv = "mtgcv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgcv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
