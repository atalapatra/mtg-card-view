[project]
name = "mtg-card-view"
dynamic = ["version"]  # single source: src/mtgcv/__init__.py (also used for release tags)
description = "GraphMTG: see how the cards in a Magic: The Gathering collection work together (Scryfall + EDHREC)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mtgcv = "mtgcv.cli:main"
graphmtg = "mtgcv.launcher:main"

[tool.hatch.version]
path = "src/mtgcv/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgcv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
